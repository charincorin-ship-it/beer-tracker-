<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🍺 クラフトビール チェックイン</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --amber:#D4860A;--amber-light:#F5A623;--amber-dark:#8B5A02;
    --foam:#FDF3DC;--dark:#0F0A04;--dark-panel:#241A0C;
    --text:#E8D5A3;--text-dim:#8A7355;
    --green:#4CAF50;--green-dark:#2e7d32;--blue:#4FC3F7;--red:#EF5350;
    --note:#7B68C8;--note-light:#A99FE0;--note-bg:rgba(123,104,200,0.12);--note-border:rgba(123,104,200,0.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--dark);color:var(--text);font-family:'Space Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:100;opacity:0.4;}
  header{width:100%;padding:22px 20px 12px;text-align:center;border-bottom:1px solid rgba(212,134,10,0.2);background:linear-gradient(180deg,rgba(212,134,10,0.08) 0%,transparent 100%);}
  .logo{font-family:'Playfair Display',serif;font-size:11px;letter-spacing:0.35em;text-transform:uppercase;color:var(--amber);margin-bottom:4px;}
  .app-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;color:var(--foam);}
  .main{width:100%;max-width:420px;padding:20px 16px;flex:1;}
  .month-card{background:var(--dark-panel);border:1px solid rgba(212,134,10,0.25);border-radius:16px;padding:18px;margin-bottom:16px;position:relative;overflow:hidden;}
  .month-label{font-size:10px;letter-spacing:0.2em;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;}
  .month-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--foam);margin-bottom:12px;}
  .month-top{display:flex;gap:12px;align-items:flex-start;}
  .stats-col{flex-shrink:0;}
  .stats-row{display:flex;gap:16px;}
  .stat-num{font-size:36px;font-weight:700;line-height:1;color:var(--amber-light);}
  .stat-label{font-size:10px;color:var(--text-dim);margin-top:3px;}
  .mini-cal{flex:1;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
  .cal-dow{font-size:9px;text-align:center;color:var(--text-dim);font-weight:700;}
  .cal-dow:first-child{color:#EF9090;}.cal-dow:last-child{color:#90B4EF;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10px;border-radius:4px;position:relative;color:var(--text-dim);}
  .cal-day.today{background:rgba(212,134,10,0.2);color:var(--amber-light);font-weight:700;}
  .cal-day.has-beer{color:var(--foam);}
  .cal-day.has-beer::after{content:'🍺';font-size:9px;position:absolute;bottom:-1px;right:-1px;}
  .cal-day.sun{color:#EF9090;}.cal-day.sat{color:#90B4EF;}
  .cal-day.has-beer.sun,.cal-day.has-beer.sat{color:var(--foam);}
  .card{background:var(--dark-panel);border:1px solid rgba(212,134,10,0.2);border-radius:16px;padding:18px;margin-bottom:14px;}
  .section-label{font-size:10px;letter-spacing:0.2em;color:var(--text-dim);text-transform:uppercase;margin-bottom:14px;}
  .status-strip{background:rgba(255,255,255,0.04);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:10px;min-height:40px;}
  .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .status-dot.on{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.5s infinite;}
  .status-dot.off{background:var(--text-dim);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
  .btn{width:100%;border:none;border-radius:13px;font-family:'Playfair Display',serif;font-size:18px;font-weight:900;padding:17px;cursor:pointer;position:relative;overflow:hidden;transition:transform 0.12s;margin-bottom:10px;}
  .btn:last-child{margin-bottom:0;}
  .btn:active{transform:scale(0.97);}
  .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.15) 0%,transparent 50%);}
  .btn-inner{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-enter{background:linear-gradient(135deg,#1a4a1a,var(--green));color:#fff;box-shadow:0 4px 18px rgba(76,175,80,0.3);}
  .btn-exit{background:linear-gradient(135deg,#4a1a1a,var(--red));color:#fff;box-shadow:0 4px 18px rgba(239,83,80,0.3);}
  .btn-office{background:linear-gradient(135deg,#1a3a5c,var(--blue));color:#fff;box-shadow:0 4px 18px rgba(79,195,247,0.25);}
  .btn-office.done{background:linear-gradient(135deg,#1a3a1a,var(--green-dark));box-shadow:0 4px 18px rgba(76,175,80,0.2);}
  /* 無効状態はopacityのみ。pointer-eventsはJSで制御 */
  .btn-disabled{opacity:0.32;cursor:not-allowed;}
  .beer-area{overflow:hidden;max-height:0;opacity:0;transition:max-height 0.4s ease,opacity 0.3s ease,margin 0.3s ease;margin-bottom:0;}
  .beer-area.visible{max-height:400px;opacity:1;margin-bottom:10px;}
  .memo-hint{font-size:10px;color:var(--amber);margin-bottom:6px;letter-spacing:0.05em;}
  .memo-row{display:flex;gap:8px;align-items:flex-end;}
  .memo-input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(212,134,10,0.25);border-radius:10px;color:var(--text);font-family:'Space Mono',monospace;font-size:13px;padding:11px 13px;resize:none;outline:none;transition:border-color 0.2s;height:48px;}
  .memo-input:focus{border-color:var(--amber);}
  .memo-input::placeholder{color:var(--text-dim);}
  .btn-memo-send{flex-shrink:0;width:48px;height:48px;background:linear-gradient(135deg,var(--amber-dark),var(--amber));border:none;border-radius:10px;color:var(--dark);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.12s;position:relative;overflow:hidden;}
  .btn-memo-send::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.2) 0%,transparent 50%);}
  .btn-memo-send:active{transform:scale(0.93);}
  .btn-memo-send span{position:relative;z-index:1;}
  .today-beers{margin-top:10px;max-height:180px;overflow-y:auto;}
  .today-beer-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);animation:fadeIn 0.2s ease;}
  .today-beer-item:last-child{border-bottom:none;}
  .tb-icon{font-size:14px;flex-shrink:0;}
  .tb-text{font-size:12px;color:var(--text);flex:1;word-break:break-all;}
  .tb-text a{color:var(--amber-light);text-decoration:underline;}
  .tb-time{font-size:10px;color:var(--text-dim);flex-shrink:0;}
  .tb-del{flex-shrink:0;background:none;border:none;color:var(--text-dim);font-size:14px;cursor:pointer;padding:2px 6px;border-radius:4px;transition:color 0.15s,background 0.15s;}
  .tb-del:active{color:var(--red);background:rgba(239,83,80,0.1);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  /* ── 確認ダイアログ（インライン） ── */
  .confirm-inline{display:none;background:rgba(212,134,10,0.08);border:1px solid rgba(212,134,10,0.4);border-radius:13px;padding:14px 14px 12px;margin-top:6px;animation:fadeIn 0.15s ease;}
  .confirm-inline.show{display:block;}
  .confirm-inline-msg{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--foam);text-align:center;margin-bottom:12px;}
  .confirm-inline-btns{display:flex;gap:10px;}
  .confirm-inline-no{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:11px;color:var(--text-dim);font-family:'Playfair Display',serif;font-size:16px;font-weight:900;padding:12px;cursor:pointer;}
  .confirm-inline-yes{flex:1;background:linear-gradient(135deg,var(--amber-dark),var(--amber));border:none;border-radius:11px;color:var(--dark);font-family:'Playfair Display',serif;font-size:16px;font-weight:900;padding:12px;cursor:pointer;}
  .confirm-inline-yes:active,.confirm-inline-no:active{opacity:0.8;}
  /* ── note欄 ── */
  .note-card{background:var(--dark-panel);border:1px solid var(--note-border);border-radius:16px;padding:18px;margin-bottom:14px;}
  .note-section-label{font-size:10px;letter-spacing:0.2em;color:var(--note-light);text-transform:uppercase;margin-bottom:10px;}
  .note-hint{font-size:10px;color:var(--note-light);margin-bottom:6px;letter-spacing:0.05em;opacity:0.8;}
  .note-row{display:flex;gap:8px;align-items:flex-end;}
  .note-input{flex:1;background:var(--note-bg);border:1px solid var(--note-border);border-radius:10px;color:var(--text);font-family:'Space Mono',monospace;font-size:13px;padding:11px 13px;resize:none;outline:none;transition:border-color 0.2s;height:48px;}
  .note-input:focus{border-color:var(--note-light);}
  .note-input::placeholder{color:var(--text-dim);}
  .btn-note-send{flex-shrink:0;width:48px;height:48px;background:linear-gradient(135deg,#4a3a8a,var(--note));border:none;border-radius:10px;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.12s;position:relative;overflow:hidden;}
  .btn-note-send::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.2) 0%,transparent 50%);}
  .btn-note-send:active{transform:scale(0.93);}
  .btn-note-send span{position:relative;z-index:1;}
  /* ── 履歴 ── */
  .history-section{background:var(--dark-panel);border:1px solid rgba(212,134,10,0.15);border-radius:16px;padding:18px;}
  .history-empty{text-align:center;color:var(--text-dim);font-size:12px;padding:24px 0;}
  .h-date-group{margin-bottom:16px;}
  .h-date-header{font-size:10px;font-weight:700;letter-spacing:0.15em;color:var(--amber);padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid rgba(212,134,10,0.2);}
  .history-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
  .history-item:last-child{border-bottom:none;}
  .h-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .h-dot.enter{background:var(--green);}.h-dot.exit{background:var(--red);}.h-dot.beer{background:var(--amber);}.h-dot.office{background:var(--blue);}.h-dot.note{background:var(--note);}
  .h-main{flex:1;}
  .h-title{font-size:11px;font-weight:700;}
  .h-title.enter{color:var(--green);}.h-title.exit{color:var(--red);}.h-title.beer{color:var(--amber);}.h-title.office{color:var(--blue);}.h-title.note{color:var(--note-light);}
  .h-sub{font-size:11px;color:var(--text-dim);margin-top:2px;word-break:break-all;}
  .h-sub a{color:var(--amber-light);text-decoration:underline;}
  .h-time{font-size:10px;color:var(--text-dim);flex-shrink:0;margin-top:2px;}
  .h-actions{display:flex;gap:6px;margin-top:4px;}
  .h-act-btn{border:none;border-radius:6px;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer;transition:opacity 0.15s;}
  .h-act-btn.edit{background:rgba(212,134,10,0.2);color:var(--amber-light);border:1px solid rgba(212,134,10,0.4);}
  .h-act-btn.del{background:rgba(239,83,80,0.15);color:var(--red);border:1px solid rgba(239,83,80,0.3);}
  .h-act-btn.note-edit{background:var(--note-bg);color:var(--note-light);border:1px solid var(--note-border);}
  .h-act-btn:active{opacity:0.7;}
  /* note行専用スタイル */
  .history-item.note-item{background:var(--note-bg);border-radius:8px;padding:7px 8px;margin-bottom:4px;border-bottom:none!important;}
  /* 履歴からの追加エリア */
  .h-add-area{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(212,134,10,0.2);}
  .h-add-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(212,134,10,0.2);border-radius:8px;color:var(--text);font-family:'Space Mono',monospace;font-size:11px;padding:7px 10px;resize:none;outline:none;height:38px;margin-bottom:6px;}
  .h-add-input:focus{border-color:var(--amber);}
  .h-add-input::placeholder{color:var(--text-dim);font-size:10px;}
  .h-add-btns{display:flex;gap:6px;}
  .h-add-btn{flex:1;background:rgba(212,134,10,0.2);border:1px solid rgba(212,134,10,0.4);border-radius:8px;color:var(--amber-light);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:7px 8px;cursor:pointer;white-space:nowrap;text-align:center;}
  .h-add-btn:active{background:rgba(212,134,10,0.35);}
  .h-add-btn.note{background:var(--note-bg);border-color:var(--note-border);color:var(--note-light);}
  .h-add-btn.note:active{background:rgba(123,104,200,0.25);}
  /* 設定 */
  .settings-card{background:var(--dark-panel);border:1px solid rgba(212,134,10,0.15);border-radius:16px;padding:18px;margin-bottom:14px;}
  .gas-url-input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(212,134,10,0.2);border-radius:8px;color:var(--text);font-family:'Space Mono',monospace;font-size:11px;padding:8px 12px;margin-top:6px;margin-bottom:10px;outline:none;}
  .gas-url-input::placeholder{color:var(--text-dim);font-size:10px;}
  .save-btn{width:100%;background:rgba(212,134,10,0.15);border:1px solid rgba(212,134,10,0.4);border-radius:10px;color:var(--amber-light);font-family:'Space Mono',monospace;font-size:12px;font-weight:700;padding:10px;cursor:pointer;margin-bottom:10px;}
  .io-btn{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:var(--text);font-family:'Space Mono',monospace;font-size:12px;font-weight:700;padding:10px;cursor:pointer;margin-bottom:8px;text-align:center;}
  .io-btn:active{background:rgba(255,255,255,0.1);}
  .connected-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(76,175,80,0.15);border:1px solid rgba(76,175,80,0.4);border-radius:100px;padding:3px 9px;font-size:10px;color:var(--green);margin-left:8px;}
  .dot-green{width:5px;height:5px;background:var(--green);border-radius:50%;}
  .io-note{font-size:10px;color:var(--text-dim);margin-top:4px;line-height:1.6;}
  .tabs{display:flex;gap:4px;background:rgba(255,255,255,0.04);border-radius:12px;padding:4px;margin-bottom:18px;}
  .tab{flex:1;background:none;border:none;color:var(--text-dim);font-family:'Space Mono',monospace;font-size:11px;padding:8px;border-radius:8px;cursor:pointer;transition:all 0.2s;}
  .tab.active{background:var(--dark-panel);color:var(--amber-light);border:1px solid rgba(212,134,10,0.3);}
  .panel{display:none;}.panel.active{display:block;}
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--dark-panel);border:1px solid var(--amber);border-radius:100px;padding:11px 22px;font-size:13px;color:var(--foam);transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);z-index:200;white-space:nowrap;box-shadow:0 8px 28px rgba(0,0,0,0.5);}
  .toast.show{transform:translateX(-50%) translateY(0);}
  footer{width:100%;text-align:center;padding:14px;font-size:10px;color:var(--text-dim);letter-spacing:0.1em;}
</style>
</head>
<body>
<header>
  <div class="logo">Craft Beer</div>
  <div class="app-title">🍺 チェックイン</div>
</header>
<div class="main">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('home')">ホーム</button>
    <button class="tab" onclick="switchTab('history')">履歴</button>
    <button class="tab" onclick="switchTab('settings')">設定</button>
  </div>

  <div id="panel-home" class="panel active">
    <div class="month-card">
      <div class="month-label">今月の記録</div>
      <div class="month-title" id="month-title"></div>
      <div class="month-top">
        <div class="stats-col">
          <div class="stats-row">
            <div><div class="stat-num" id="count-visits">0</div><div class="stat-label">🍺 今月</div></div>
            <div><div class="stat-num" id="count-total">0</div><div class="stat-label">📊 累計</div></div>
          </div>
        </div>
        <div class="mini-cal" id="mini-cal"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">🏪 お店</div>
      <div class="status-strip">
        <div class="status-dot off" id="shop-dot"></div>
        <span id="shop-status">まだ入店していません</span>
      </div>
      <button class="btn btn-enter" id="btn-enter" onclick="doEnter()">
        <div class="btn-inner"><span>🚪</span><span>入店する</span></div>
      </button>
      <div class="beer-area" id="beer-area">
        <div class="memo-hint">🍺 飲んだビールをメモ（📝 ボタンで送信）</div>
        <div class="memo-row">
          <textarea class="memo-input" id="memo" rows="1" placeholder="例: インペリアルIPA、フルーティで◎"></textarea>
          <button class="btn-memo-send" onclick="doBeerMemo()"><span>📝</span></button>
        </div>
        <div class="today-beers" id="today-beers"></div>
      </div>
      <!-- 退店ボタン：disabled属性は使わずJSのみで制御 -->
      <button class="btn btn-exit btn-disabled" id="btn-exit" onclick="onExitClick()">
        <div class="btn-inner"><span>🚶</span><span>退店する</span></div>
      </button>
      <!-- 退店確認（インライン）：position:fixedを使わないのでどの環境でも確実に表示 -->
      <div class="confirm-inline" id="confirm-exit">
        <div class="confirm-inline-msg">🚶 退店しますか？</div>
        <div class="confirm-inline-btns">
          <button class="confirm-inline-no" onclick="closeExitConfirm()">いいえ</button>
          <button class="confirm-inline-yes" onclick="doExitConfirmed()">はい</button>
        </div>
      </div>
    </div>

    <!-- コメント欄（ビールカウント外） -->
    <div class="note-card">
      <div class="note-section-label">📝 メモ欄（カウント外）</div>
      <div class="note-hint">おつまみの感想・ビール以外の備忘録など（本数にカウントされません）</div>
      <div class="note-row">
        <textarea class="note-input" id="note-input" rows="1" placeholder="例: 枝豆が最高だった、次はポーター頼もう"></textarea>
        <button class="btn-note-send" onclick="doNoteMemo()"><span>✏️</span></button>
      </div>
    </div>

    <div class="card">
      <div class="section-label">🏢 会社</div>
      <div class="status-strip">
        <div class="status-dot off" id="office-dot"></div>
        <span id="office-status">本日の退社未記録</span>
      </div>
      <button class="btn btn-office" id="btn-office" onclick="onOfficeClick()">
        <div class="btn-inner"><span>🚪</span><span id="office-label">退社する</span></div>
      </button>
      <!-- 退社確認（インライン） -->
      <div class="confirm-inline" id="confirm-office">
        <div class="confirm-inline-msg">🏢 退社しますか？</div>
        <div class="confirm-inline-btns">
          <button class="confirm-inline-no" onclick="closeOfficeConfirm()">いいえ</button>
          <button class="confirm-inline-yes" onclick="doOfficeConfirmed()">はい</button>
        </div>
      </div>
    </div>
  </div>

  <div id="panel-history" class="panel">
    <div class="history-section">
      <div class="section-label">今月の履歴</div>
      <div id="history-list"><div class="history-empty">まだ記録がありません</div></div>
    </div>
  </div>

  <div id="panel-settings" class="panel">
    <div class="settings-card">
      <div class="section-label">Googleカレンダー連携（任意）</div>
      <div style="font-size:12px;color:var(--text);margin-bottom:4px;">
        Apps Script URL
        <span id="connected-badge" style="display:none" class="connected-badge"><span class="dot-green"></span>接続済</span>
      </div>
      <input type="url" class="gas-url-input" id="gas-url" placeholder="https://script.google.com/macros/s/xxxx/exec">
      <button class="save-btn" onclick="saveSettings()">💾 設定を保存</button>
    </div>
    <div class="settings-card">
      <div class="section-label">📦 データのバックアップ</div>
      <button class="io-btn" onclick="exportData()">⬇️ エクスポート（JSONダウンロード）</button>
      <button class="io-btn" onclick="document.getElementById('import-file').click()">⬆️ インポート（JSONを読み込む）</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
      <div class="io-note">機種変更の際は「エクスポート」でバックアップを保存し、新しい端末で「インポート」してください。</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<footer>CRAFT BEER TRACKER v1.9</footer>

<script>
/* ============================================================
   ストレージ（localStorage + メモリfallback）
   ============================================================ */
var KEY = 'beer_tracker_v1';
var _mem = {};
var _useMem = false;
try { localStorage.setItem('__t__','1'); localStorage.removeItem('__t__'); }
catch(e) { _useMem = true; }
function _get(k){ return _useMem ? (_mem[k]||null) : localStorage.getItem(k); }
function _set(k,v){ if(_useMem){ _mem[k]=v; } else { localStorage.setItem(k,v); } }

function load(){ var r=_get(KEY); if(!r) return {records:[],gasUrl:''}; try{ return JSON.parse(r); }catch(e){ return {records:[],gasUrl:''}; } }
function save(s){ _set(KEY, JSON.stringify(s)); }
function push(rec){ var s=load(); s.records.push(rec); save(s); }

/* ============================================================
   日時ユーティリティ
   ============================================================ */
function nowJST(){ var d=new Date(); return new Date(d.getTime()+(d.getTimezoneOffset()+540)*60000); }
function todayJST(){ var d=nowJST(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function getYMJST(){ var d=nowJST(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function pad(n){ return String(n).padStart(2,'0'); }
function hm(ts){ var d=new Date(ts); var j=new Date(d.getTime()+(d.getTimezoneOffset()+540)*60000); return pad(j.getHours())+':'+pad(j.getMinutes()); }

/* ============================================================
   linkify：URLをリンクに変換
   Googleフォト短縮URL (photos.app.goo.gl) を含む各種フォーマット対応
   ※ escHtml()より先にURL抽出することで &amp; 化を防ぐ
   ============================================================ */
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function isPhotoUrl(url){
  return /\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(url)
    || /instagram\.com/i.test(url)
    || /twimg\.com/i.test(url)
    || /photos\.app\.goo\.gl/i.test(url)
    || /photos\.google\.com/i.test(url)
    || /photo\.google\.com/i.test(url)
    || /google\.com\/photos/i.test(url)
    || /lh\d+\.googleusercontent\.com/i.test(url);
}
function linkify(text){
  var re = /(https?:\/\/[^\s"<>]+)/g;
  var result = ''; var last = 0; var m;
  while((m = re.exec(text)) !== null){
    result += escHtml(text.slice(last, m.index));
    var url = m[1];
    var label = isPhotoUrl(url) ? '📸 写真' : escHtml(url);
    result += '<a href="'+escHtml(url)+'" target="_blank" rel="noopener">'+label+'</a>';
    last = m.index + m[0].length;
  }
  result += escHtml(text.slice(last));
  return result;
}

/* ============================================================
   状態判定
   ============================================================ */
function monthRecs(){ var ym=getYMJST(); return load().records.filter(function(r){ return r.date && r.date.startsWith(ym); }); }

function isInShop(){
  var s=load(); var td=todayJST();
  var tr=s.records.filter(function(r){ return r.date===td; });
  var enters=tr.filter(function(r){ return r.type==='enter'; });
  var exits=tr.filter(function(r){ return r.type==='exit'; });
  var le=enters.length ? enters[enters.length-1] : null;
  var lx=exits.length ? exits[exits.length-1] : null;
  return !!(le && (!lx || new Date(le.ts) > new Date(lx.ts)));
}

/* ============================================================
   確認ダイアログ（インライン方式）
   ============================================================ */
function onExitClick(){
  /* btn-disabledのときは何もしない */
  if(document.getElementById('btn-exit').classList.contains('btn-disabled')) return;
  var el=document.getElementById('confirm-exit');
  el.classList.toggle('show');
}
function closeExitConfirm(){ document.getElementById('confirm-exit').classList.remove('show'); }

function onOfficeClick(){
  if(document.getElementById('btn-office').classList.contains('btn-disabled')) return;
  var el=document.getElementById('confirm-office');
  el.classList.toggle('show');
}
function closeOfficeConfirm(){ document.getElementById('confirm-office').classList.remove('show'); }

/* ============================================================
   カレンダー描画
   ============================================================ */
function renderCalendar(){
  var d=nowJST(); var year=d.getFullYear(); var month=d.getMonth();
  var todayStr=todayJST(); var ym=getYMJST();
  var state=load(); var beerDays={};
  state.records.forEach(function(r){ if(r.type==='exit' && r.date && r.date.startsWith(ym)) beerDays[r.date]=true; });
  var firstDay=new Date(year,month,1).getDay();
  var dim=new Date(year,month+1,0).getDate();
  var dows=['日','月','火','水','木','金','土'];
  var html='<div class="cal-header">';
  dows.forEach(function(dw){ html+='<div class="cal-dow">'+dw+'</div>'; });
  html+='</div><div class="cal-grid">';
  for(var i=0;i<firstDay;i++) html+='<div class="cal-day"></div>';
  for(var day=1;day<=dim;day++){
    var ds=year+'-'+pad(month+1)+'-'+pad(day);
    var dow=(firstDay+day-1)%7;
    var cls='cal-day';
    if(ds===todayStr) cls+=' today';
    if(beerDays[ds]) cls+=' has-beer';
    if(dow===0) cls+=' sun'; if(dow===6) cls+=' sat';
    html+='<div class="'+cls+'">'+day+'</div>';
  }
  html+='</div>';
  document.getElementById('mini-cal').innerHTML=html;
}

/* ============================================================
   本日のビール一覧（ホーム画面）
   ============================================================ */
function updateTodayBeers(){
  var state=load(); var td=todayJST();
  var beers=state.records.filter(function(r){ return r.type==='beer' && r.date===td && r.memo; });
  var el=document.getElementById('today-beers');
  if(!beers.length){ el.innerHTML=''; return; }
  el.innerHTML=beers.map(function(r){
    var tsE=r.ts.replace(/'/g,"\\'");
    return '<div class="today-beer-item">'
      +'<span class="tb-icon">🍺</span>'
      +'<span class="tb-text">'+linkify(r.memo)+'</span>'
      +'<span class="tb-time">'+hm(r.ts)+'</span>'
      +'<button class="tb-del" onclick="delBeerMemo(\''+tsE+'\')" title="削除">✕</button>'
      +'</div>';
  }).join('');
  el.scrollTop=el.scrollHeight;
}

function delBeerMemo(ts){
  var state=load();
  var target=state.records.find(function(r){ return r.type==='beer' && r.ts===ts; });
  if(!target){ showToast('対象が見つかりません'); return; }
  state.records=state.records.filter(function(r){ return !(r.type===target.type && r.ts===target.ts && r.date===target.date); });
  save(state); updateTodayBeers(); updateUI(); showToast('🗑️ メモを削除しました');
}

/* ============================================================
   メイン UI 更新
   ============================================================ */
function updateUI(){
  var state=load(); var mr=monthRecs(); var td=todayJST();
  var tr=state.records.filter(function(r){ return r.date===td; });

  /* カウント：exitのみ。note/beer/enterは含まない */
  var visits = mr.filter(function(r){ return r.type==='exit'; }).length;
  var total  = state.records.filter(function(r){ return r.type==='exit'; }).length;

  var d=nowJST();
  document.getElementById('month-title').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月';
  document.getElementById('count-visits').textContent=visits;
  document.getElementById('count-total').textContent=total;
  renderCalendar();

  /* 入退店状態 */
  var enters=tr.filter(function(r){ return r.type==='enter'; });
  var exits =tr.filter(function(r){ return r.type==='exit';  });
  var lastEnter=enters.length ? enters[enters.length-1] : null;
  var lastExit =exits.length  ? exits[exits.length-1]   : null;
  var inShop=!!(lastEnter && (!lastExit || new Date(lastEnter.ts)>new Date(lastExit.ts)));

  var shopDot  =document.getElementById('shop-dot');
  var shopStat =document.getElementById('shop-status');
  var btnEnter =document.getElementById('btn-enter');
  var btnExit  =document.getElementById('btn-exit');
  var beerArea =document.getElementById('beer-area');

  if(inShop){
    shopDot.className='status-dot on';
    shopStat.textContent='入店中  '+hm(lastEnter.ts)+'〜';
    btnEnter.classList.add('btn-disabled');
    /* 退店ボタン：有効化 */
    btnExit.classList.remove('btn-disabled');
    beerArea.classList.add('visible');
    updateTodayBeers();
  } else if(lastExit){
    var stayMin=lastEnter ? Math.round((new Date(lastExit.ts)-new Date(lastEnter.ts))/60000) : null;
    shopDot.className='status-dot off';
    shopStat.textContent='退店済み '+hm(lastExit.ts)+(stayMin!=null ? '（滞在'+stayMin+'分）' : '');
    btnEnter.classList.remove('btn-disabled');
    /* 退店ボタン：無効化 & ダイアログを閉じる */
    btnExit.classList.add('btn-disabled');
    closeExitConfirm();
    beerArea.classList.add('visible');
    updateTodayBeers();
  } else {
    shopDot.className='status-dot off';
    shopStat.textContent='まだ入店していません';
    btnEnter.classList.remove('btn-disabled');
    btnExit.classList.add('btn-disabled');
    closeExitConfirm();
    beerArea.classList.remove('visible');
  }

  /* 退社状態 */
  var officeRec=tr.find(function(r){ return r.type==='office'; });
  var officeBtn=document.getElementById('btn-office');
  if(officeRec){
    document.getElementById('office-dot').className='status-dot off';
    document.getElementById('office-status').textContent='退社済み  '+hm(officeRec.ts);
    officeBtn.classList.add('done','btn-disabled');
    document.getElementById('office-label').textContent='退社済み ✓';
    closeOfficeConfirm();
  } else {
    document.getElementById('office-dot').className='status-dot off';
    document.getElementById('office-status').textContent='本日の退社未記録';
    officeBtn.classList.remove('done','btn-disabled');
    document.getElementById('office-label').textContent='退社する';
  }

  renderHistory(mr);
  document.getElementById('gas-url').value=state.gasUrl||'';
  document.getElementById('connected-badge').style.display=state.gasUrl ? 'inline-flex' : 'none';
}

/* ============================================================
   履歴描画
   ============================================================ */
function renderHistory(mr){
  var histEl=document.getElementById('history-list');
  if(!mr.length){ histEl.innerHTML='<div class="history-empty">まだ記録がありません</div>'; return; }
  var dayNames=['日','月','火','水','木','金','土'];
  var groups={}; var groupOrder=[];
  mr.forEach(function(r){
    if(!groups[r.date]){ groups[r.date]=[]; groupOrder.push(r.date); }
    groups[r.date].push(r);
  });
  groupOrder.reverse();
  histEl.innerHTML=groupOrder.map(function(date){
    var dt=new Date(date+'T00:00:00');
    var dateLabel=(dt.getMonth()+1)+'/'+dt.getDate()+'（'+dayNames[dt.getDay()]+'）';
    var hasEnter=groups[date].some(function(r){ return r.type==='enter'; });
    var beerCount=groups[date].filter(function(r){ return r.type==='beer'; }).length;

    var items=groups[date].map(function(r){
      var tsE=r.ts.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

      /* ── note型：タイム非表示、専用スタイル ── */
      if(r.type==='note'){
        return '<div class="history-item note-item">'
          +'<div class="h-dot note"></div>'
          +'<div class="h-main">'
          +'<div class="h-title note">✏️ メモ</div>'
          +'<div class="h-sub" data-ts="'+escHtml(r.ts)+'">'+linkify(r.memo||'')+'</div>'
          +'<div class="h-actions">'
          +'<button class="h-act-btn note-edit" onclick="editMemo(\''+tsE+'\',\'note\',this)">編集</button>'
          +'<button class="h-act-btn del" onclick="delMemo(\''+tsE+'\')">削除</button>'
          +'</div></div></div>';
      }

      /* ── それ以外 ── */
      var icon ={enter:'🚪',exit:'🚶',beer:'🍺',office:'🏢'}[r.type]||'';
      var label={enter:'入店',exit:'退店',beer:'ビール',office:'退社'}[r.type]||r.type;
      var sub='';
      if(r.type==='exit'){
        if(r.stayMin!=null) sub='滞在 '+r.stayMin+'分';
        if(beerCount>0) sub+=(sub?'　':'')+'🍺 '+beerCount+'杯';
      }
      if(r.type==='beer' && r.memo) sub=r.memo;
      var subHtml=sub
        ? '<div class="h-sub" data-ts="'+escHtml(r.ts)+'">'+(r.type==='beer' ? linkify(sub) : escHtml(sub))+'</div>'
        : '';
      var actions=r.type==='beer'
        ? '<div class="h-actions">'
          +'<button class="h-act-btn edit" onclick="editMemo(\''+tsE+'\',\'beer\',this)">編集</button>'
          +'<button class="h-act-btn del" onclick="delMemo(\''+tsE+'\')">削除</button>'
          +'</div>'
        : '';
      return '<div class="history-item">'
        +'<div class="h-dot '+r.type+'"></div>'
        +'<div class="h-main">'
        +'<div class="h-title '+r.type+'">'+icon+' '+label+'</div>'
        +subHtml+actions
        +'</div>'
        +'<div class="h-time">'+hm(r.ts)+'</div>'
        +'</div>';
    }).join('');

    /* ── 履歴からの追加エリア（🍺追加 / 📝メモ の2択） ── */
    var addArea = hasEnter
      ? '<div class="h-add-area">'
        +'<textarea class="h-add-input" placeholder="メモを入力..." data-date="'+date+'"></textarea>'
        +'<div class="h-add-btns">'
        +'<button class="h-add-btn" onclick="histAdd(\''+date+'\',this,\'beer\')">🍺 ビールとして追加</button>'
        +'<button class="h-add-btn note" onclick="histAdd(\''+date+'\',this,\'note\')">📝 メモとして追加</button>'
        +'</div></div>'
      : '';

    return '<div class="h-date-group"><div class="h-date-header">'+dateLabel+'</div>'+items+addArea+'</div>';
  }).join('');
}

/* ============================================================
   履歴からメモ追加（beer or note を選択可能）
   ============================================================ */
function histAdd(date, btn, type){
  var input=btn.closest('.h-add-area').querySelector('.h-add-input');
  var memo=input.value.trim();
  if(!memo){ showToast('メモを入力してください'); return; }
  var state=load();
  var dayRecs=state.records.filter(function(r){ return r.date===date; });
  var exitRecs=dayRecs.filter(function(r){ return r.type==='exit'; });
  var beerRecs=dayRecs.filter(function(r){ return r.type==='beer'; });
  /* タイムスタンプ生成：既存レコードがあれば前後に挿入、なければ日付の正午（JST）を基準にする
     → new Date() を使わないので過去日追加でも並び順が安定する */
  var pseudoTs;
  if(exitRecs.length){
    pseudoTs=new Date(new Date(exitRecs[exitRecs.length-1].ts).getTime()-60000).toISOString();
  } else if(beerRecs.length){
    pseudoTs=new Date(new Date(beerRecs[beerRecs.length-1].ts).getTime()+60000).toISOString();
  } else {
    /* 該当日のレコードなし → その日の正午JSTをUTCに変換してセット */
    pseudoTs=new Date(date+'T03:00:00.000Z').toISOString(); /* 正午JST = UTC 03:00 */
  }
  push({type:type, ts:pseudoTs, date:date, memo:memo});
  input.value='';
  updateUI();
  showToast(type==='beer' ? '🍺 ビールメモを追加しました' : '✏️ メモを追加しました');
}

/* ============================================================
   メモ編集・削除
   ============================================================ */
function delMemo(ts){
  /* type+ts+dateの3条件で絞る（同時刻に複数種別が存在しても誤削除しない） */
  var state=load();
  var target=state.records.find(function(r){ return r.ts===ts; });
  if(!target){ showToast('対象が見つかりません'); return; }
  state.records=state.records.filter(function(r){ return !(r.type===target.type && r.ts===target.ts && r.date===target.date); });
  save(state); updateUI(); showToast('🗑️ メモを削除しました');
}

function editMemo(ts, type, btn){
  var state=load();
  var rec=state.records.find(function(r){ return r.ts===ts; });
  if(!rec) return;
  var subEl=document.querySelector('[data-ts="'+ts+'"]');
  if(!subEl || subEl.querySelector('input')) return;
  var cur=rec.memo||'';
  var borderColor=type==='note' ? 'var(--note-border)' : 'var(--amber)';
  var btnClass=type==='note' ? 'note-edit' : 'edit';
  subEl.innerHTML='<input value="'+escHtml(cur)+'" style="width:100%;background:rgba(255,255,255,0.07);border:1px solid '+borderColor+';border-radius:6px;color:var(--text);font-family:\'Space Mono\',monospace;font-size:12px;padding:5px 8px;outline:none;">'
    +'<button class="h-act-btn '+btnClass+'" onclick="saveMemo(\''+ts.replace(/'/g,"\\'")+'\',\''+type+'\',this)" style="margin-top:4px">保存</button>';
}

function saveMemo(ts, type, btn){
  var input=btn.previousElementSibling;
  var newMemo=input.value.trim();
  if(!newMemo){ showToast('メモを入力してください'); return; }
  var state=load();
  state.records=state.records.map(function(r){ if(r.ts===ts && r.type===type) r.memo=newMemo; return r; });
  save(state); updateUI(); showToast('✏️ メモを編集しました');
}

/* ============================================================
   アクション
   ============================================================ */
function sendGas(payload){
  var url=load().gasUrl; if(!url) return;
  /* mode:'cors' でレスポンスを受け取り、エラーを検知できるようにする
     GAS側で Access-Control-Allow-Origin ヘッダーが必要（doPost の返り値に設定）
     GASが未設定の場合は no-cors にフォールバックして通信は継続する */
  fetch(url, {
    method: 'POST',
    mode: 'cors',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  })
  .then(function(res){
    if(!res.ok) console.warn('[GAS] HTTP error:', res.status);
  })
  .catch(function(err){
    /* CORSエラーの場合は no-cors でリトライ（GAS未設定環境への互換） */
    console.warn('[GAS] cors failed, retrying with no-cors:', err);
    fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)})
      .catch(function(e){ console.error('[GAS] no-cors also failed:', e); });
  });
}

function doEnter(){
  if(isInShop()){ showToast('すでに入店中です'); return; }
  var now=new Date();
  push({type:'enter',ts:now.toISOString(),date:todayJST()});
  updateUI(); showToast('🚪 入店を記録しました');
  sendGas({type:'enter',timestamp:now.toISOString()});
  setTimeout(function(){ document.getElementById('memo').focus(); },50);
}

function doExitConfirmed(){
  closeExitConfirm();
  var state=load(); var now=new Date(); var td=todayJST();
  var enters=state.records.filter(function(r){ return r.type==='enter' && r.date===td; });
  var lastEnter=enters.length ? enters[enters.length-1] : null;
  var stayMin=lastEnter ? Math.round((now-new Date(lastEnter.ts))/60000) : null;
  push({type:'exit',ts:now.toISOString(),date:td,stayMin:stayMin});
  updateUI();
  showToast(stayMin!=null ? '🚶 退店（滞在 '+stayMin+'分）' : '🚶 退店しました');
  sendGas({type:'exit',timestamp:now.toISOString(),stayMin:stayMin});
}

function doOfficeConfirmed(){
  closeOfficeConfirm();
  var now=new Date();
  push({type:'office',ts:now.toISOString(),date:todayJST()});
  updateUI(); showToast('🏢 退社時刻を記録しました');
  sendGas({type:'office',timestamp:now.toISOString()});
}

function doBeerMemo(){
  var memo=document.getElementById('memo').value.trim();
  if(!memo){ showToast('メモを入力してください'); return; }
  var td=todayJST(); var state=load();
  var hasVisit=state.records.some(function(r){ return r.date===td && r.type==='enter'; });
  if(!hasVisit){ showToast('入店後にメモできます'); return; }
  var now=new Date();
  push({type:'beer',ts:now.toISOString(),date:td,memo:memo});
  document.getElementById('memo').value='';
  updateTodayBeers(); updateUI(); showToast('🍺 メモしました！');
  sendGas({type:'beer',timestamp:now.toISOString(),memo:memo});
}

function doNoteMemo(){
  var memo=document.getElementById('note-input').value.trim();
  if(!memo){ showToast('メモを入力してください'); return; }
  var td=todayJST();
  push({type:'note',ts:new Date().toISOString(),date:td,memo:memo});
  document.getElementById('note-input').value='';
  updateUI(); showToast('✏️ メモしました');
}

/* ============================================================
   キーボードショートカット
   ============================================================ */
/* Enter → 改行のみ（送信しない）
   スマホにはShift+Enterがないため、送信はボタンタップに集約 */
document.getElementById('memo').addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.stopPropagation(); } /* デフォルト動作（改行）をそのまま許可 */
});
document.getElementById('note-input').addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.stopPropagation(); }
});

/* ============================================================
   設定・データ管理
   ============================================================ */
function saveSettings(){
  var s=load(); s.gasUrl=document.getElementById('gas-url').value.trim();
  save(s); updateUI(); showToast('✓ 設定を保存しました');
}

function exportData(){
  var state=load();
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob); var a=document.createElement('a'); var d=nowJST();
  a.href=url; a.download='beer_tracker_backup_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json';
  a.click(); URL.revokeObjectURL(url); showToast('⬇️ バックアップを保存しました');
}

function importData(e){
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      if(!data.records) throw new Error();
      save(data); updateUI(); showToast('⬆️ データをインポートしました');
    }catch(err){ showToast('⚠️ ファイルが正しくありません'); }
    e.target.value='';
  };
  reader.readAsText(file);
}

/* ============================================================
   トースト・タブ
   ============================================================ */
var _toastTimer;
function showToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(function(){ el.classList.remove('show'); },2600);
}

function switchTab(tab){
  var names=['home','history','settings'];
  document.querySelectorAll('.tab').forEach(function(t,i){ t.classList.toggle('active',names[i]===tab); });
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('panel-'+tab).classList.add('active');
}

/* 初期化 */
updateUI();
</script>
